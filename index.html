<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Exercise 13</title>
<style>
  .box {
    width: 100px;
    height: 100px;
    background-color: #f8c6c8;
    border: 1px solid #999999;
    color: #c0392b;
    font-size: 16px;
    padding: 4px;
    margin-bottom: 30px;
    transition: width 1s, height 1s;
  }

  .box1:hover {
    width: 500px;
  }

  .box2:hover {
    width: 180px;
    height: 180px;
  }
</style>
</head>
<body>

  <div class="box box1">1</div>
  <div class="box box2">2</div>

</body>
</html>
